name: Build project

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=On
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
      - name: Install
        run: cmake --install build --config Debug --prefix "${{ runner.temp }}/qpOASES-install"
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.os }}
          path: "${{ runner.temp }}/qpOASES-install"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install gcovr
        run: python -m pip install gcovr
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DCMAKE_SHARED_LINKER_FLAGS=--coverage
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report coverage
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' \
            --txt coverage/coverage.txt \
            --html-details coverage/index.html \
            --cobertura coverage/coverage.xml \
            --markdown-summary coverage/summary.md \
            --markdown-title 'Line coverage of src/' \
            --print-summary \
            build
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage

  python:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: backend-${{ matrix.os }}
          path: "${{ runner.temp }}/qpOASES-install"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: interfaces/python/pyproject.toml
      - name: Install python dependencies
        working-directory: interfaces/python
        run: |
          python -m pip install --upgrade pip build
      - name: Test Python package
        working-directory: interfaces/python
        env:
          CFLAGS: -I${{ github.workspace }}/include
          CXXFLAGS: -I${{ github.workspace }}/include
          LDFLAGS: -L${{ github.workspace}}/build/libs
          QPOASES_PREFIX: ${{ runner.temp }}/qpOASES-install
        run: |
          python -m pip install tox
          tox
